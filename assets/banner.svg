<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Veylith — principles for better work">
  <title>Veylith</title>
  <defs>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-style: italic; }
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="#0A0A0B"/>
  <rect x="44" y="40" width="1192" height="320" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- mark -->
  <g transform="translate(100 106)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="56" rx="15" fill="#111113"/>
    <rect x="0.75" y="0.75" width="54.5" height="54.5" rx="14.25" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <path d="M13 16 L28 42 L43 16" stroke="#F5F5F4" stroke-width="3.4"/>
    <path d="M20 16 L28 28.5 L36 16" stroke="#F5F5F4" stroke-opacity="0.5" stroke-width="2.4"/>
    <circle cx="28" cy="13" r="2.2" fill="#F5F5F4" stroke="none"/>
  </g>

  <text x="180" y="121" class="serif" font-size="17" fill="#A1A1AA">Skills for agents</text>

  <text x="180" y="216" class="sans" font-size="86" font-weight="600" letter-spacing="-2.6" fill="#F5F5F4">Veylith</text>

  <rect x="180" y="242" width="240" height="1" fill="#FFFFFF" fill-opacity="0.16"/>

  <text x="180" y="290" class="sans" font-size="20" fill="#D4D4D8">Skills built around precision, resourcefulness,</text>
  <text x="180" y="320" class="sans" font-size="20" fill="#8A8A93">and getting the most out of what is already there.</text>

</svg>
