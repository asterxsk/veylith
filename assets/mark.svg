<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Veylith">
  <title>Veylith</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12142A"/>
      <stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9A8FF"/>
      <stop offset="0.55" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#25D8EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#tile)"/>
  <rect x="4.9" y="4.9" width="118.2" height="118.2" rx="29.1" fill="none" stroke="url(#rim)" stroke-width="1.8"/>
  <ellipse cx="52" cy="46" rx="46" ry="40" fill="url(#glow)" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 38 L64 96 L98 38" stroke="url(#stroke)" stroke-width="8.5"/>
    <path d="M46 38 L64 67 L82 38" stroke="#25D8EE" stroke-width="6" stroke-opacity="0.9"/>
  </g>
  <circle cx="64" cy="31" r="5" fill="#FFFFFF" fill-opacity="0.88"/>
  <circle cx="94" cy="94" r="2.6" fill="#FFFFFF" fill-opacity="0.42"/>
</svg>
